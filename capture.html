<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture - BD Replay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="capture">
  <header>
    <a href="index.html">BD Replay</a>
    <a href="capture.html">Capture</a>
    <a href="upload.html">Upload</a>
    <a href="library.html">Library</a>
    <a href="settings.html">Settings</a>
  </header>
  <main class="panel">
    <h1>Capture a Replay</h1>
    <video id="preview" style="width:100%;max-height:50vh;background:#000;" playsinline></video>
    <div style="margin-top:1rem;">
      <button id="start-btn" class="button">Start Recording</button>
      <button id="stop-btn" class="button" disabled>Stop Recording</button>
    </div>
    <p style="font-size:0.8rem;margin-top:0.5rem;">While recording the app will collect motion data using your device orientation sensors.</p>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
